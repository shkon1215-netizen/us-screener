name: Run screen and publish

# The NYSE and Nasdaq close at 16:00 New York time: 20:00 UTC in daylight
# saving, 21:00 UTC in winter. 22:30 UTC is after both, still the same New
# York day, and leaves Yahoo time to settle the day's closes.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  pages: write
  id-token: write

# A scheduled run and a manual one must not publish over each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned rather than ubuntu-latest, so a runner-image change arrives as a
    # commit that can be tested, not as a silent switch mid-schedule.
    runs-on: ubuntu-26.04
    # ~3,800 .info calls and ~2,000 statement sets cold - the largest
    # universe of the series - so more headroom than Hong Kong's 60.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Offline logic check
        run: python test_us.py

      # Yahoo rate-limits by IP and shared runner addresses are already busy.
      # main_us.py stops fetching after a run of refusals and refuses to
      # screen a partial universe rather than publishing a thin one, so a
      # retry after a pause is the right recovery: the per-day cache in
      # .us_cache keeps whatever arrived, and each attempt only asks for the
      # gaps. The US universe is ~3,800 lines, three times Hong Kong's, so it
      # gets two retries with longer pauses rather than one.
      - name: Screen
        id: screen
        continue-on-error: true
        run: python main_us.py --all --dashboard ""

      - name: Screen (retry after rate-limit pause)
        id: retry1
        if: steps.screen.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "First attempt failed - most likely Yahoo throttling. Pausing."
          sleep 300
          python main_us.py --all --dashboard ""

      - name: Screen (second retry)
        if: steps.screen.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: |
          echo "Second attempt failed too. Pausing longer."
          sleep 600
          python main_us.py --all --dashboard ""

      - name: Build site
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
